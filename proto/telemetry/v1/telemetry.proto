syntax = "proto3";

package telemetry.v1;

option go_package = "github.com/Ajayendra2705/iicpc-platform/proto/gen/go/telemetry/v1;telemetryv1";

service TelemetryIngester {
  // bot-worker streams every order ack timing here
  rpc IngestStream(stream OrderEvent) returns (IngestAck);

  // aggregator pulls or pushes rolled-up metrics
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
  ORDER_TYPE_CANCEL = 3;
}

enum OrderResult {
  ORDER_RESULT_UNSPECIFIED = 0;
  ORDER_RESULT_FILLED = 1;
  ORDER_RESULT_PARTIAL = 2;
  ORDER_RESULT_REJECTED = 3;
  ORDER_RESULT_TIMEOUT = 4;
  ORDER_RESULT_ACK_ONLY = 5;
}

// OrderSide is the buy/sell direction of an order. Carried explicitly so the
// validator can replay price-time priority without guessing from the order id.
enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  ORDER_SIDE_BUY = 1;
  ORDER_SIDE_SELL = 2;
}

message OrderEvent {
  string trace_id = 1;
  string contestant_id = 2;
  string bot_id = 3;
  string order_id = 4;
  OrderType type = 5;
  OrderResult result = 6;

  int64 sent_ts_ns = 7; // bot monotonic clock at send
  int64 ack_ts_ns = 8; // bot monotonic clock at ack
  int64 latency_ns = 9; // ack_ts_ns - sent_ts_ns

  double price = 10;
  int64 quantity = 11;
  int64 filled_quantity = 12;

  string reject_reason = 13;

  OrderSide side = 14; // buy/sell direction, for price-time-priority replay
}

message IngestAck {
  int64 events_received = 1;
}

message QueryMetricsRequest {
  string contestant_id = 1;
  int64 since_unix_ms = 2;
  int64 until_unix_ms = 3;
}

message LatencyPercentiles {
  int64 p50_ns = 1;
  int64 p90_ns = 2;
  int64 p99_ns = 3;
  int64 p999_ns = 4;
}

message QueryMetricsResponse {
  string contestant_id = 1;
  LatencyPercentiles latency = 2;
  double tps = 3;
  double fill_accuracy = 4;
  int64 total_orders = 5;
  int64 rejected = 6;
  int64 timeouts = 7;
}
