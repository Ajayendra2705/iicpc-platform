apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    # PodSecurityAdmission: enforce the strictest profile. Any pod created
    # in this namespace must drop all caps, run as non-root, use a
    # seccomp profile, and have a read-only root FS.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/part-of: iicpc-platform
    app.kubernetes.io/managed-by: helm
