apiVersion: v1
kind: Namespace
metadata:
  name: iicpc-platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: submission-svc-config
  namespace: iicpc-platform
data:
  SUBMISSION_HTTP_ADDR: ":8081"
  MINIO_ENDPOINT: "minio.iicpc-platform.svc.cluster.local:9000"
  MINIO_BUCKET: "submissions"
  MINIO_USE_SSL: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: submission-svc-secrets
  namespace: iicpc-platform
type: Opaque
stringData:
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-svc
  namespace: iicpc-platform
  labels:
    app: submission-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: submission-svc
  template:
    metadata:
      labels:
        app: submission-svc
    spec:
      nodeSelector:
        iicpc.io/pool: services
      containers:
        - name: submission-svc
          image: iicpc/submission-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: submission-svc-config
            - secretRef:
                name: submission-svc-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: submission-svc
  namespace: iicpc-platform
spec:
  selector:
    app: submission-svc
  ports:
    - name: http
      port: 8081
      targetPort: http
