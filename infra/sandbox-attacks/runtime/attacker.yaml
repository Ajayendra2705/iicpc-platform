# Attacker pod: passes PSA admission (correct securityContext + matches the
# contestant-pod baseline), then runs 6 in-pod attacks against the runtime
# boundaries (seccomp, cgroups, NetworkPolicy, ReadOnlyRootFilesystem).
#
# Each attack prints either "BLOCKED: <reason>" (expected) or "ESCALATED" (bad).
# The runner script greps for "ESCALATED" and fails the whole report if any
# attack succeeded.
apiVersion: v1
kind: Pod
metadata:
  name: attack-runtime
  namespace: iicpc-contestants
  labels:
    app: contestant-pod
    iicpc.io/sandbox-attack: "true"
spec:
  restartPolicy: Never
  # Match the production contestant-pod baseline so we test the same defences
  # a real contestant pod has.
  containers:
    - name: attacker
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - |
          # Capture stderr+stdout into a variable; the filesystem is read-only
          # so we can't redirect to a temp file. Pattern:
          #   out=$(cmd 2>&1); if [ $? -eq 0 ]; then ESCALATED; else BLOCKED.
          set +e

          echo "=== Attack 1: write to /etc/passwd (readOnlyRootFilesystem) ==="
          out=$(echo "evil::0:0::/root:/bin/sh" >> /etc/passwd 2>&1)
          if [ $? -eq 0 ]; then echo "ESCALATED: wrote to /etc/passwd"; else echo "BLOCKED: ${out:-Permission denied}"; fi

          echo "=== Attack 2: raw AF_PACKET socket (seccomp + CAP_NET_RAW dropped) ==="
          out=$(cat /dev/net/tun 2>&1)
          if [ $? -eq 0 ]; then echo "ESCALATED: opened /dev/net/tun"; else echo "BLOCKED: ${out:-no permission}"; fi

          echo "=== Attack 3: mount tmpfs (CAP_SYS_ADMIN dropped) ==="
          out=$(mount -t tmpfs none /tmp 2>&1)
          if [ $? -eq 0 ]; then echo "ESCALATED: mounted tmpfs"; else echo "BLOCKED: ${out:-permission denied}"; fi

          echo "=== Attack 4: read another pod's /proc/1/mem (PID namespace) ==="
          out=$(cat /proc/2/mem 2>&1 >/dev/null)
          if [ $? -eq 0 ]; then echo "ESCALATED: read /proc/2/mem"; else echo "BLOCKED: ${out:-no such PID}"; fi

          echo "=== Attack 5: egress to 1.1.1.1:80 (NetworkPolicy egress allowlist) ==="
          out=$(wget --timeout=3 -qO- http://1.1.1.1/ 2>&1 >/dev/null)
          if [ $? -eq 0 ]; then echo "ESCALATED: reached 1.1.1.1"; else echo "BLOCKED: ${out:-connection timed out}"; fi

          echo "=== Attack 6: install package as non-root (no apk perms) ==="
          out=$(apk add curl 2>&1 >/dev/null | head -1)
          if [ $? -eq 0 ] && [ -z "$out" ]; then echo "ESCALATED: installed curl"; else echo "BLOCKED: ${out:-not permitted}"; fi

          echo "=== ALL ATTACKS COMPLETE ==="
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
