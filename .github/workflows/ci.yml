name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  GOPRIVATE: github.com/Ajayendra2705
  GONOSUMDB: github.com/Ajayendra2705

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - proto/gen/go
          - services/aggregator
          - services/api-gateway
          - services/bot-coordinator
          - services/bot-worker
          - services/leaderboard-svc
          - services/sandbox-runner
          - services/submission-svc
          - services/telemetry-ingester
          - services/validator
    steps:
      - uses: actions/checkout@v4

      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          format: true
          lint: true
          breaking: false
          push: false

  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/aggregator
          - services/api-gateway
          - services/bot-coordinator
          - services/bot-worker
          - services/leaderboard-svc
          - services/sandbox-runner
          - services/submission-svc
          - services/telemetry-ingester
          - services/validator
    steps:
      - uses: actions/checkout@v4

      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: ${{ matrix.module }}
          args: --timeout=5m
