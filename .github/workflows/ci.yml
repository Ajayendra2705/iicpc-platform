name: CI

on:
  push:
    branches: [main, master]
    # Docs-only commits skip CI to stay under the 2000-min/month free tier.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - "IDEAS.md"
      - "HANDOFF.md"
      - "README.md"
      - "PLAN.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

env:
  GOPRIVATE: github.com/Ajayendra2705
  GONOSUMDB: github.com/Ajayendra2705

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - proto/gen/go
          - services/aggregator
          - services/api-gateway
          - services/bot-coordinator
          - services/bot-worker
          - services/leaderboard-svc
          - services/sandbox-runner
          - services/submission-svc
          - services/telemetry-ingester
          - services/validator
    steps:
      - uses: actions/checkout@v4

      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          format: true
          lint: true
          breaking: false
          push: false

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, no creds)
        run: terraform init -backend=false
      - name: terraform validate
        env:
          # validate doesn't actually hit AWS, but the var is required
          TF_VAR_db_password: dummy-validate-only
        run: terraform validate

  golangci-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/aggregator
          - services/api-gateway
          - services/bot-coordinator
          - services/bot-worker
          - services/leaderboard-svc
          - services/sandbox-runner
          - services/submission-svc
          - services/telemetry-ingester
          - services/validator
    steps:
      - uses: actions/checkout@v4

      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"
      - name: helm lint
        run: helm lint infra/helm/iicpc-platform
      - name: helm template (dev)
        run: helm template iicpc infra/helm/iicpc-platform > /tmp/dev.yaml
      - name: helm template (production overlay)
        run: |
          helm template iicpc infra/helm/iicpc-platform \
            -f infra/helm/iicpc-platform/values.yaml \
            -f infra/helm/iicpc-platform/values.production.yaml \
            > /tmp/prod.yaml
      - name: kubeconform (manifest schema check — helm + chaos + sandbox)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          /tmp/kubeconform -strict -summary -kubernetes-version 1.30.0 \
            /tmp/dev.yaml /tmp/prod.yaml \
            infra/manifests/chaos/isolate-policy.yaml \
            infra/manifests/chaos/pumba-network-delay.yaml

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint (shared Go service Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: infra/docker/Dockerfile.service
          failure-threshold: error
      - name: hadolint (web/Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: error

  service-image-build:
    runs-on: ubuntu-latest
    needs: dockerfile-lint
    steps:
      - uses: actions/checkout@v4
      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - uses: docker/setup-buildx-action@v3
      - name: Build one service image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.service
          platforms: linux/amd64
          build-args: SERVICE=leaderboard-svc
          tags: iicpc/leaderboard-svc:ci
          push: false
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Build web image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: web/Dockerfile
          platforms: linux/amd64
          tags: iicpc/web:ci
          push: false
